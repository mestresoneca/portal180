<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notícia · Portal 180</title>
<meta property="og:type" content="article">
<meta property="og:site_name" content="Portal 180">
<meta property="og:title" content="Portal 180">
<meta property="og:description" content="">
<meta property="og:image" content="https://portal180.pages.dev/og-default.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0D0F12;--bg2:#13161B;--bg3:#1A1E26;--line:#252A35;--line2:#2E3440;--ink:#F0F2F5;--ink2:#B8C0CC;--ink3:#7A8494;--red:#E8192C;--radius:10px;--max-w:1200px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
.article-wrap{max-width:760px;margin:0 auto;padding:40px 24px 70px;}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3);margin-bottom:24px;flex-wrap:wrap;}
.breadcrumb a{color:var(--ink3);transition:color .15s;}
.breadcrumb a:hover{color:var(--ink);}
.breadcrumb svg{width:12px;height:12px;flex-shrink:0;}
.art-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--red);background:rgba(232,25,44,.1);padding:5px 11px;border-radius:6px;margin-bottom:16px;}
.art-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:44px;line-height:1.05;margin-bottom:16px;color:var(--ink);}
.art-meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink3);margin-bottom:28px;flex-wrap:wrap;}
.art-meta strong{color:var(--ink2);font-weight:600;}
.art-meta .sep{width:4px;height:4px;border-radius:50%;background:var(--line2);}
.art-img{width:100%;max-height:500px;object-fit:cover;border-radius:var(--radius);margin-bottom:32px;}
.art-excerpt{font-size:17px;font-weight:500;color:var(--ink2);line-height:1.7;margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid var(--line);}
.art-body{font-size:15px;line-height:1.85;color:var(--ink2);}
.art-body h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;color:var(--ink);margin:32px 0 12px;}
.art-body h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;color:var(--ink);margin:24px 0 8px;}
.art-body p{margin-bottom:18px;}
.art-body ul,.art-body ol{margin:0 0 18px 24px;}
.art-body li{margin-bottom:8px;}
.art-body strong{color:var(--ink);font-weight:700;}
.art-body blockquote{border-left:3px solid var(--red);padding:8px 18px;color:var(--ink3);margin:20px 0;font-style:italic;background:rgba(232,25,44,.04);border-radius:0 8px 8px 0;}
.art-share{margin-top:40px;padding-top:28px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.art-share span{font-size:13px;font-weight:600;color:var(--ink3);}
.share-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid var(--line);background:var(--bg2);color:var(--ink2);font-family:inherit;}
.share-btn:hover{background:var(--bg3);color:var(--ink);}
.share-btn svg{width:14px;height:14px;}
.back-btn{display:inline-flex;align-items:center;gap:8px;margin-top:36px;padding:10px 18px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);transition:all .15s;}
.back-btn:hover{background:var(--bg3);color:var(--ink);}
.back-btn svg{width:14px;height:14px;}
.loading{text-align:center;padding:80px 24px;color:var(--ink3);font-size:14px;}
.not-found{text-align:center;padding:80px 24px;}
.not-found h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;margin-bottom:8px;}
.not-found p{color:var(--ink3);margin-bottom:20px;}
.site-footer{max-width:var(--max-w);margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink3);border-top:1px solid var(--line);}
.site-footer a{color:var(--ink3);}
@media(max-width:600px){.art-title{font-size:30px;}.article-wrap{padding:24px 16px 50px;}}
</style>
</head>
<body>
<script src="nav.js"></script>
<div class="article-wrap" id="content">
  <div class="loading">A carregar notícia...</div>
</div>
<footer class="site-footer">
  <span>Portal 180 · Notícias de Setas</span>
  <a href="noticias.html">← Todas as notícias</a>
</footer>
<script>
const SUPABASE_URL="https://rqqytfrcnavexinmgbhu.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxcXl0ZnJjbmF2ZXhpbm1nYmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NzE5MTEsImV4cCI6MjEwMTA0NzkxMX0.4yY0PHxtjn631DXZyZyvmklEXM8fRYwiB8ENDOWEjEE";
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
function fmtDate(d){return new Date(d).toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function updateOG(t,d,i,u){[["og:title",t,true],["og:description",d,true],["og:image",i||"https://portal180.pages.dev/og-default.png",true],["og:url",u,true],["twitter:title",t,false],["twitter:description",d,false],["twitter:image",i,false]].forEach(function(m){var el=document.querySelector((m[2]?'[property="':'[name="')+m[0]+'"]');if(el&&m[1])el.setAttribute("content",m[1]);});}
function shareWA(t,u){window.open("https://wa.me/?text="+encodeURIComponent(t+" — "+u),"_blank");}
function shareTW(t,u){window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(t)+"&url="+encodeURIComponent(u),"_blank");}
function copyLink(u){navigator.clipboard.writeText(u).then(function(){alert("Link copiado!");});}
async function load(){
  var slug=new URLSearchParams(window.location.search).get("slug");
  var c=document.getElementById("content");
  var notFound='<div class="not-found"><h2>Notícia não encontrada</h2><p>Esta notícia não existe ou foi removida.</p><a class="back-btn" href="noticias.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Voltar às notícias</a></div>';
  if(!slug){c.innerHTML=notFound;return;}
  var {data,error}=await db.from("noticias").select("*").eq("slug",slug).eq("publicado",true).single();
  if(error||!data){c.innerHTML=notFound;return;}
  document.title=data.titulo+" · Portal 180";
  var url=window.location.href;
  updateOG(data.titulo+" · Portal 180",data.excerpt||data.titulo,data.imagem_url,url);
  c.innerHTML=
    '<div class="breadcrumb"><a href="index.html">Início</a>'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>'+
    '<a href="noticias.html">Notícias</a>'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>'+
    '<span>'+data.categoria+'</span></div>'+
    '<span class="art-tag">'+data.categoria+'</span>'+
    '<h1 class="art-title">'+data.titulo+'</h1>'+
    '<div class="art-meta"><strong>'+data.autor+'</strong><span class="sep"></span><span>'+fmtDate(data.publicado_em||data.criado_em)+'</span></div>'+
    (data.imagem_url?'<img class="art-img" src="'+data.imagem_url+'" alt="'+data.titulo+'">':'')+
    (data.excerpt?'<div class="art-excerpt">'+data.excerpt+'</div>':'')+
    '<div class="art-body">'+data.conteudo+'</div>'+
    '<div class="art-share"><span>Partilhar:</span>'+
    '<button class="share-btn" onclick="shareWA(\''+data.titulo.replace(/'/g,"\\'")+'\',\''+url+'\')">'+
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>WhatsApp</button>'+
    '<button class="share-btn" onclick="shareTW(\''+data.titulo.replace(/'/g,"\\'")+'\',\''+url+'\')">'+
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>X/Twitter</button>'+
    '<button class="share-btn" onclick="copyLink(\''+url+'\')">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Copiar link</button></div>'+
    '<a class="back-btn" href="noticias.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Voltar às notícias</a>';
}
load();
</script>
</body>
</html>
