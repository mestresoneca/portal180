<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notícia · Portal 180</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0D0F12;--bg2:#13161B;--bg3:#1A1E26;--line:#252A35;--line2:#2E3440;--ink:#F0F2F5;--ink2:#B8C0CC;--ink3:#7A8494;--red:#E8192C;--radius:10px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}

.topbar{background:var(--bg2);border-bottom:1px solid var(--line);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:32px;height:32px;border-radius:8px;background:var(--red);display:flex;align-items:center;justify-content:center;}
.logo-icon svg{width:18px;height:18px;}
.logo-text{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase;}
.logo-text em{font-style:normal;color:var(--red);}
.back-link{font-size:13px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:6px;transition:color .15s;}
.back-link:hover{color:var(--ink);}
.back-link svg{width:14px;height:14px;}

.wrap{max-width:760px;margin:0 auto;padding:36px 24px 70px;}

.article-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin-bottom:14px;background:rgba(232,25,44,.1);padding:4px 10px;border-radius:5px;}
.article-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:42px;line-height:1.05;margin-bottom:14px;}
.article-meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink3);margin-bottom:24px;flex-wrap:wrap;}
.article-meta strong{color:var(--ink2);font-weight:600;}
.article-meta .sep{width:4px;height:4px;border-radius:50%;background:var(--ink3);}
.article-img{width:100%;max-height:480px;object-fit:cover;border-radius:var(--radius);margin-bottom:28px;display:block;}
.article-excerpt{font-size:17px;color:var(--ink2);line-height:1.65;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--line);font-weight:500;}
.article-body{font-size:15px;line-height:1.8;color:var(--ink2);}
.article-body h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;color:var(--ink);margin:28px 0 10px;}
.article-body h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;color:var(--ink);margin:22px 0 8px;}
.article-body p{margin-bottom:16px;}
.article-body ul,
.article-body ol{margin:0 0 16px 22px;}
.article-body li{margin-bottom:6px;}
.article-body strong{color:var(--ink);font-weight:700;}
.article-body blockquote{border-left:3px solid var(--red);padding:4px 16px;color:var(--ink3);margin:16px 0;font-style:italic;}

.back-btn{display:inline-flex;align-items:center;gap:8px;margin-top:36px;padding:10px 18px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);transition:all .15s;}
.back-btn:hover{background:var(--bg3);color:var(--ink);}
.back-btn svg{width:14px;height:14px;}

.loading{text-align:center;padding:80px 24px;color:var(--ink3);}
.not-found{text-align:center;padding:80px 24px;}
.not-found h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;margin-bottom:8px;}
.not-found p{color:var(--ink3);margin-bottom:20px;}

@media(max-width:600px){.article-title{font-size:30px;}.wrap{padding:24px 16px 50px;}}
</style>
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html">
    <div class="logo-icon">
      <svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" stroke="white" stroke-width="8" opacity=".3"/><circle cx="50" cy="50" r="9" fill="white"/><line x1="50" y1="5" x2="50" y2="41" stroke="white" stroke-width="5" stroke-linecap="round"/><polygon points="50,5 44,20 56,20" fill="white"/></svg>
    </div>
    <div class="logo-text">Portal <em>180</em></div>
  </a>
  <a class="back-link" href="noticias.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Notícias
  </a>
</header>

<div class="wrap" id="content">
  <div class="loading">A carregar notícia...</div>
</div>

<script>
const SUPABASE_URL = "https://rqqytfrcnavexinmgbhu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxcXl0ZnJjbmF2ZXhpbm1nYmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NzE5MTEsImV4cCI6MjEwMTA0NzkxMX0.4yY0PHxtjn631DXZyZyvmklEXM8fRYwiB8ENDOWEjEE";
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

function fmtDate(d){
  return new Date(d).toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}

async function load(){
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");
  const content = document.getElementById("content");

  if(!slug){
    content.innerHTML = '<div class="not-found"><h2>Notícia não encontrada</h2><p>O link que seguiste não é válido.</p><a class="back-btn" href="noticias.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Voltar às notícias</a></div>';
    return;
  }

  const { data, error } = await db
    .from("noticias")
    .select("*")
    .eq("slug", slug)
    .eq("publicado", true)
    .single();

  if(error || !data){
    content.innerHTML = '<div class="not-found"><h2>Notícia não encontrada</h2><p>Esta notícia não existe ou foi removida.</p><a class="back-btn" href="noticias.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Voltar às notícias</a></div>';
    return;
  }

  document.title = data.titulo + " · Portal 180";

  const dateStr = fmtDate(data.publicado_em || data.criado_em);

  content.innerHTML = `
    <span class="article-tag">${data.categoria}</span>
    <h1 class="article-title">${data.titulo}</h1>
    <div class="article-meta">
      <strong>${data.autor}</strong>
      <span class="sep"></span>
      <span>${dateStr}</span>
    </div>
    ${data.imagem_url ? `<img class="article-img" src="${data.imagem_url}" alt="${data.titulo}">` : ""}
    ${data.excerpt ? `<div class="article-excerpt">${data.excerpt}</div>` : ""}
    <div class="article-body">${data.conteudo}</div>
    <a class="back-btn" href="noticias.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar às notícias
    </a>
  `;
}

load();
</script>
</body>
</html>
