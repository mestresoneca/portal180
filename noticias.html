<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="description" content="Últimas notícias sobre setas em Portugal e no mundo. Acompanha todos os acontecimentos das ligas nacionais e internacionais.">
<meta name="keywords" content="notícias setas, darts portugal, liga portuguesa setas">
<meta name="author" content="Portal 180">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Portal 180">
<meta property="og:title" content="Notícias · Portal 180">
<meta property="og:description" content="Últimas notícias sobre setas em Portugal e no mundo. Acompanha todos os acontecimentos das ligas nacionais e internacionais.">
<meta property="og:url" content="https://portal180.pages.dev/">
<meta property="og:image" content="https://portal180.pages.dev/og-default.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Notícias · Portal 180">
<meta name="twitter:description" content="Últimas notícias sobre setas em Portugal e no mundo. Acompanha todos os acontecimentos das ligas nacionais e internacionais.">
<meta name="twitter:image" content="https://portal180.pages.dev/og-default.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notícias · Portal 180</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0D0F12;--bg2:#13161B;--bg3:#1A1E26;--line:#252A35;--line2:#2E3440;--ink:#F0F2F5;--ink2:#B8C0CC;--ink3:#7A8494;--red:#E8192C;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}

.topbar{background:var(--bg2);border-bottom:1px solid var(--line);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:32px;height:32px;border-radius:8px;background:var(--red);display:flex;align-items:center;justify-content:center;}
.logo-icon svg{width:18px;height:18px;}
.logo-text{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase;}
.logo-text em{font-style:normal;color:var(--red);}
.back-link{font-size:13px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:6px;transition:color .15s;}
.back-link:hover{color:var(--ink);}
.back-link svg{width:14px;height:14px;}

.page-hero{background:var(--bg2);border-bottom:1px solid var(--line);padding:32px 24px;}
.page-hero-inner{max-width:1100px;margin:0 auto;}
.page-hero h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:40px;text-transform:uppercase;margin-bottom:4px;}
.page-hero h1 span{color:var(--red);}
.page-hero p{font-size:14px;color:var(--ink3);}

.filters{background:var(--bg2);border-bottom:1px solid var(--line);padding:0 24px;}
.filters-inner{max-width:1100px;margin:0 auto;display:flex;gap:6px;height:46px;align-items:center;overflow-x:auto;scrollbar-width:none;}
.filters-inner::-webkit-scrollbar{display:none;}
.filter-btn{flex-shrink:0;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--ink3);cursor:pointer;background:transparent;transition:all .15s;}
.filter-btn:hover{color:var(--ink);border-color:var(--line2);}
.filter-btn.active{background:var(--red);color:#fff;border-color:var(--red);}

.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 60px;}
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:860px){.news-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.news-grid{grid-template-columns:1fr;}}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .15s,border-color .15s;cursor:pointer;}
.card:hover{transform:translateY(-2px);border-color:var(--line2);}
.card-img{width:100%;height:180px;object-fit:cover;background:var(--bg3);}
.card-img-ph{width:100%;height:180px;background:linear-gradient(135deg,var(--bg3),var(--bg));display:flex;align-items:center;justify-content:center;}
.card-img-ph svg{width:40px;height:40px;opacity:.12;}
.card-body{padding:16px;}
.card-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin-bottom:7px;}
.card-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;line-height:1.15;margin-bottom:8px;}
.card-excerpt{font-size:13px;color:var(--ink3);line-height:1.55;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card-meta{font-size:11px;color:var(--ink3);display:flex;justify-content:space-between;}
.card-author{font-weight:600;color:var(--ink2);}

.loading{text-align:center;padding:60px;color:var(--ink3);}
.skeleton{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 37%,var(--bg2) 63%);background-size:400% 100%;animation:sh 1.4s ease infinite;border-radius:6px;}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.skel-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.skel-img{height:180px;}.skel-body{padding:16px;}.skel-line{height:14px;margin-bottom:10px;}
.skel-line:last-child{width:60%;}

.empty{text-align:center;padding:60px 24px;color:var(--ink3);}
.empty svg{width:48px;height:48px;margin:0 auto 14px;opacity:.2;}
.empty h3{font-size:18px;font-weight:600;margin-bottom:6px;color:var(--ink2);}
</style>
</head>
<body>
<script src="nav.js"></script>



<div class="page-hero">
  <div class="page-hero-inner">
    <h1>Últimas <span>Notícias</span></h1>
    <p>Todas as novidades sobre o mundo das setas em Portugal e no mundo</p>
  </div>
</div>

<div class="filters">
  <div class="filters-inner">
    <button class="filter-btn active" data-cat="todas" onclick="filterCat('todas',this)">Todas</button>
    <button class="filter-btn" data-cat="Nacionais" onclick="filterCat('Nacionais',this)">🇵🇹 Nacionais</button>
    <button class="filter-btn" data-cat="Internacionais" onclick="filterCat('Internacionais',this)">🌍 Internacionais</button>
    <button class="filter-btn" data-cat="Equipas" onclick="filterCat('Equipas',this)">Equipas</button>
    <button class="filter-btn" data-cat="Individuais" onclick="filterCat('Individuais',this)">Individuais</button>
    <button class="filter-btn" data-cat="Associações" onclick="filterCat('Associações',this)">Associações</button>
  </div>
</div>

<div class="wrap">
  <div class="news-grid" id="news-grid">
    <!-- skeleton -->
    ${[1,2,3,4,5,6].map(()=>`<div class="skel-card"><div class="skel-img skeleton"></div><div class="skel-body"><div class="skel-line skeleton" style="width:40%;height:10px;margin-bottom:8px;"></div><div class="skel-line skeleton" style="height:18px;margin-bottom:6px;"></div><div class="skel-line skeleton"></div><div class="skel-line skeleton"></div></div></div>`).join("")}
  </div>
</div>

<script>
const SUPABASE_URL = "https://rqqytfrcnavexinmgbhu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxcXl0ZnJjbmF2ZXhpbm1nYmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NzE5MTEsImV4cCI6MjEwMTA0NzkxMX0.4yY0PHxtjn631DXZyZyvmklEXM8fRYwiB8ENDOWEjEE";
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let all = [];
let currentCat = "todas";

function fmtDate(d){
  return new Date(d).toLocaleDateString("pt-PT",{day:"numeric",month:"long",year:"numeric"});
}

function renderCards(data){
  const grid = document.getElementById("news-grid");
  if(!data.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><h3>Sem notícias nesta categoria</h3></div>';
    return;
  }
  grid.innerHTML = data.map(a => `
    <a class="card" href="noticia.html?slug=${a.slug}">
      ${a.imagem_url
        ? `<img class="card-img" src="${a.imagem_url}" alt="${a.titulo}" loading="lazy">`
        : `<div class="card-img-ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div>`
      }
      <div class="card-body">
        <div class="card-tag">${a.categoria}</div>
        <h2 class="card-title">${a.titulo}</h2>
        ${a.excerpt ? `<p class="card-excerpt">${a.excerpt}</p>` : ""}
        <div class="card-meta">
          <span class="card-author">${a.autor}</span>
          <span>${fmtDate(a.publicado_em || a.criado_em)}</span>
        </div>
      </div>
    </a>
  `).join("");
}

function filterCat(cat, el){
  currentCat = cat;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  const filtered = cat === "todas" ? all : all.filter(a => a.categoria === cat);
  renderCards(filtered);
}

async function load(){
  const { data, error } = await db
    .from("noticias")
    .select("id,titulo,slug,excerpt,imagem_url,autor,categoria,publicado_em,criado_em")
    .eq("publicado", true)
    .order("publicado_em", { ascending: false });
  if(error){ document.getElementById("news-grid").innerHTML = '<div class="empty" style="grid-column:1/-1"><h3>Erro ao carregar notícias</h3></div>'; return; }
  all = data || [];

  // Check URL for category filter
  const params = new URLSearchParams(window.location.search);
  const catParam = params.get("cat");
  if(catParam){
    const btn = document.querySelector(`.filter-btn[data-cat="${catParam}"]`);
    if(btn) filterCat(catParam, btn);
    else renderCards(all);
  } else {
    renderCards(all);
  }
}

load();
</script>
</body>
</html>
