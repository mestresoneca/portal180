<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASL 2ª Divisão B · Portal 180</title>
<meta name="description" content="Série B 2025/2026 · Associação de Setas de Lisboa">
<meta property="og:title" content="ASL 2ª Divisão B · Portal 180">
<meta property="og:description" content="Série B 2025/2026 · Associação de Setas de Lisboa">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Portal 180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0F12;--bg2:#13161B;--bg3:#1A1E26;
  --line:#252A35;--line2:#2E3440;
  --ink:#F0F2F5;--ink2:#B8C0CC;--ink3:#7A8494;
  --red:#E8192C;--radius:10px;
  --shadow:0 2px 8px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --max-w:1200px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}

/* PAGE HERO */
.page-hero{
  background:linear-gradient(135deg,var(--bg2) 0%,var(--bg) 100%);
  border-bottom:1px solid var(--line);
  padding:28px 24px;
  position:relative;overflow:hidden;
}
.page-hero::before{
  content:"";position:absolute;top:-60px;right:-60px;
  width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(57,73,171,.25) 0%,transparent 70%);
  pointer-events:none;
}
.page-hero-inner{
  max-width:var(--max-w);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.page-hero-left{display:flex;align-items:center;gap:16px;}
.assoc-badge{
  width:52px;height:52px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:15px;color:#fff;
  background:linear-gradient(135deg,#1a237e,#3949AB);box-shadow:0 4px 16px rgba(57,73,171,.25);flex-shrink:0;
}
.hero-text h1{
  font-family:"Barlow Condensed",sans-serif;font-weight:900;
  font-size:32px;text-transform:uppercase;letter-spacing:.01em;line-height:1;
}
.hero-text h1 span{color:var(--red);}
.hero-text p{font-size:13px;color:var(--ink3);margin-top:5px;}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--ink3);background:var(--bg3);border:1px solid var(--line);
  border-radius:8px;padding:8px 14px;transition:all .15s;flex-shrink:0;
}
.back-btn:hover{color:var(--ink);border-color:var(--line2);}
.back-btn svg{width:13px;height:13px;}

/* WRAP */
.wrap{max-width:var(--max-w);margin:0 auto;padding:24px 20px 60px;}

/* PODIUM */
.podium{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;margin-bottom:24px;}
@media(max-width:700px){.podium{grid-template-columns:1fr;}}
.pcard{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;
  position:relative;overflow:hidden;transition:border-color .15s;
}
.pcard:hover{border-color:var(--line2);}
.pcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;}
.pcard.r1::before{background:linear-gradient(90deg,#D4A437,#F3D27C);}
.pcard.r2::before{background:#9AA5B1;}
.pcard.r3::before{background:#C58A52;}
.pcard .rankno{
  font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:11px;
  letter-spacing:.08em;color:var(--ink3);text-transform:uppercase;
}
.pcard .who{display:flex;align-items:center;gap:13px;}
.avatar{
  width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;color:#fff;flex-shrink:0;
}
.r1 .avatar{background:linear-gradient(135deg,#D4A437,#b9852a);}
.r2 .avatar{background:linear-gradient(135deg,#9AA5B1,#76808c);}
.r3 .avatar{background:linear-gradient(135deg,#C58A52,#93623a);}
.pcard .pname{font-weight:700;font-size:15px;line-height:1.2;word-break:break-word;}
.pcard .statline{display:flex;align-items:baseline;gap:7px;}
.pcard .big{font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:34px;line-height:1;color:var(--red);}
.pcard .lbl{font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;font-weight:600;}
.pcard .micro{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3);}

/* PANEL */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.panel-title{
  font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700;
  text-transform:uppercase;letter-spacing:.02em;
  display:flex;align-items:center;gap:10px;
}
.panel-title::before{content:"";width:3px;height:18px;background:var(--red);border-radius:2px;}
.meta-row{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink3);}
.refresh-btn{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--ink2);background:var(--bg3);border:1px solid var(--line);
  border-radius:8px;padding:7px 12px;cursor:pointer;transition:all .15s;font-family:inherit;
}
.refresh-btn:hover{background:var(--line);color:var(--ink);}
.refresh-btn svg{width:13px;height:13px;}
.refresh-btn.spinning svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* TABLE */
.table-scroll{overflow-x:auto;}
table{border-collapse:collapse;width:100%;min-width:620px;}
thead th{
  position:sticky;top:0;background:var(--bg3);z-index:2;
  text-align:center;font-family:"Inter",sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);
  padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
thead th:nth-child(2){text-align:left;}
thead th:first-child,tbody td:first-child{position:sticky;left:0;z-index:1;background:var(--bg3);width:46px;}
thead th:nth-child(2),tbody td:nth-child(2){position:sticky;left:46px;z-index:1;min-width:160px;}
tbody td:nth-child(2){background:var(--bg2);}
tbody tr:nth-child(even) td:nth-child(2){background:#0F1318;}
tbody td{
  padding:11px 12px;border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);
  white-space:nowrap;text-align:center;
}
tbody td.name-cell{font-family:"Inter",sans-serif;font-weight:600;font-size:13.5px;text-align:left;color:var(--ink);}
tbody tr:nth-child(even){background:#0F1318;}
tbody tr:hover td{background:rgba(232,25,44,.04);}
tbody tr:hover td:first-child,tbody tr:hover td:nth-child(2){background:rgba(232,25,44,.07);}
td.diff-pos{color:#4ade80;font-weight:600;}
td.diff-neg{color:#f87171;font-weight:600;}
td.pts{color:var(--red);font-weight:700;font-size:14px;}
.rankbadge{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:7px;font-weight:700;font-size:12px;
  font-family:"Barlow Condensed",sans-serif;
}
.rank-1{background:#D4A437;color:#1c1305;}
.rank-2{background:#9AA5B1;color:#1c1305;}
.rank-3{background:#C58A52;color:#241405;}
.rank-n{background:transparent;color:var(--ink3);border:1px solid var(--line);}

/* STATES */
.state-row td{text-align:center;padding:50px;color:var(--ink3);font-family:"Inter",sans-serif;font-size:14px;}
.skeleton{
  height:14px;border-radius:4px;margin:0 auto;
  background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 37%,var(--bg2) 63%);
  background-size:400% 100%;animation:sh 1.4s ease infinite;
}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

/* FOOTER */
.site-footer{
  max-width:var(--max-w);margin:24px auto 0;padding:16px 20px;
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink3);
  border-top:1px solid var(--line);
}
.site-footer a{color:var(--ink3);transition:color .15s;}
.site-footer a:hover{color:var(--ink);}

@media(max-width:680px){
  .wrap{padding:16px 12px 40px;}
  .page-hero{padding:20px 16px;}
  .hero-text h1{font-size:26px;}
  .pcard .big{font-size:28px;}
}
</style>
</head>
<body>
<script src="nav.js"></script>

<div class="page-hero">
  <div class="page-hero-inner">
    <div class="page-hero-left">
      <div class="assoc-badge">ASL</div>
      <div class="hero-text">
        <h1>ASL · <span>2ª Divisão B</span></h1>
        <p>Série B 2025/2026 · Associação de Setas de Lisboa</p>
      </div>
    </div>
    <a class="back-btn" href="asl.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      ASL
    </a>
  </div>
</div>

<div class="wrap">
  <div class="podium" id="podium"></div>
  <section class="panel">
    <div class="panel-head">
      <span class="panel-title">2ª Divisão B</span>
      <div class="meta-row">
        <span id="updated-label">—</span>
        <button class="refresh-btn" id="refresh-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          Atualizar
        </button>
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr id="table-head"></tr></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </section>
</div>

<footer class="site-footer">
  <span>Dados em tempo real via 2K Dart Software</span>
  <a href="index.html">Portal 180 →</a>
</footer>

<script>
(function(){
"use strict";
var API="/api/asl-div2b";
var COLS=["pos","name","p","w","d","l","sets1","sets2","setsDiff","legs1","legs2","legsDiff","pts"];
var LBL={pos:"#",name:"Equipa",p:"J",w:"V",d:"E",l:"D",sets1:"S+",sets2:"S-",setsDiff:"DS",legs1:"L+",legs2:"L-",legsDiff:"DL",pts:"Pts"};
var TIT={pos:"Posição",name:"Equipa",p:"Jogos",w:"Vitórias",d:"Empates",l:"Derrotas",sets1:"Sets Marcados",sets2:"Sets Sofridos",setsDiff:"Diferença de Sets",legs1:"Legs Marcados",legs2:"Legs Sofridos",legsDiff:"Diferença de Legs",pts:"Pontos"};

function initials(n){if(!n)return"?";var p=String(n).replace(/[_.]+/g," ").trim().split(/\s+/);return((p[0]||"")[0]+(p[1]||"")[0]).toUpperCase()||"?";}
function extractRows(d){if(d&&d.tableEntries&&Array.isArray(d.tableEntries)){var f=d.tableEntries[0];if(f&&f.tableEntries&&Array.isArray(f.tableEntries))return f.tableEntries;}return Array.isArray(d)?d:[];}
function mapRow(r){var pos=String(r.placement||"").replace(".","").trim();var s1=r.sets1||0,s2=r.sets2||0,l1=r.legs1||0,l2=r.legs2||0;return{pos:parseInt(pos,10)||(r.index+1),name:r.participantName||(r.participant&&r.participant.displayName)||"—",p:r.matchCount,w:r.win,d:r.tie,l:r.lost,sets1:s1,sets2:s2,setsDiff:s1-s2,legs1:l1,legs2:l2,legsDiff:l1-l2,pts:r.points1};}

function buildHead(){var tr=document.getElementById("table-head");tr.innerHTML="";COLS.forEach(function(k){var th=document.createElement("th");th.textContent=LBL[k]||k;th.title=TIT[k]||k;if(k==="name")th.style.textAlign="left";tr.appendChild(th);});}

function renderPodium(rows){
  var pod=document.getElementById("podium");pod.innerHTML="";
  rows.slice(0,3).forEach(function(row,i){
    var r=i+1,c=document.createElement("div");c.className="pcard r"+r;
    c.innerHTML='<div class="rankno">#'+r+'</div>'+
      '<div class="who"><div class="avatar">'+initials(row.name)+'</div>'+
      '<div class="pname">'+(row.name||"—")+'</div></div>'+
      '<div class="statline"><span class="big">'+(row.pts!=null?row.pts:"—")+'</span>'+
      '<span class="lbl">PTS</span></div>'+
      '<div class="micro">'+(row.w!=null?row.w:"—")+'V &nbsp;'+(row.d!=null?row.d:"—")+'E &nbsp;'+(row.l!=null?row.l:"—")+'D</div>';
    pod.appendChild(c);
  });
}

function renderTable(rows){
  var tbody=document.getElementById("table-body");tbody.innerHTML="";
  if(!rows||rows.length===0){document.getElementById("podium").innerHTML="";var tr=document.createElement("tr");tr.className="state-row";var td=document.createElement("td");td.colSpan=COLS.length;td.textContent="Sem resultados disponíveis.";tr.appendChild(td);tbody.appendChild(tr);return;}
  renderPodium(rows);
  rows.forEach(function(row,i){
    var tr=document.createElement("tr");
    COLS.forEach(function(k){
      var td=document.createElement("td"),val=row[k];
      if(k==="pos"){var rk=Number(val)||(i+1),sp=document.createElement("span");sp.className="rankbadge "+(rk===1?"rank-1":rk===2?"rank-2":rk===3?"rank-3":"rank-n");sp.textContent=rk;td.appendChild(sp);}
      else if(k==="name"){td.className="name-cell";td.textContent=val||"—";}
      else if(k==="setsDiff"||k==="legsDiff"){var n=Number(val);if(!isNaN(n)&&n>0)td.classList.add("diff-pos");if(!isNaN(n)&&n<0)td.classList.add("diff-neg");td.textContent=(val===null||val===undefined||val==="")?"—":(n>0?"+"+n:String(n));}
      else{if(k==="pts")td.classList.add("pts");td.textContent=(val===null||val===undefined||val==="")?"—":String(val);}
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function showSkeleton(){
  var t=document.getElementById("table-body");t.innerHTML="";document.getElementById("podium").innerHTML="";
  for(var i=0;i<8;i++){var tr=document.createElement("tr");tr.className="state-row";var td=document.createElement("td");td.colSpan=COLS.length;var sk=document.createElement("div");sk.className="skeleton";sk.style.maxWidth=(50+Math.random()*40)+"%";td.appendChild(sk);tr.appendChild(td);t.appendChild(tr);};
}

function load(){
  document.getElementById("refresh-btn").classList.add("spinning");showSkeleton();
  fetch(API+"?_="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(j){renderTable(extractRows(j).map(mapRow));document.getElementById("updated-label").textContent="Atualizado às "+new Date().toLocaleTimeString("pt-PT");})
    .catch(function(e){console.error(e);var t=document.getElementById("table-body");t.innerHTML="";var tr=document.createElement("tr");tr.className="state-row";var td=document.createElement("td");td.colSpan=COLS.length;td.textContent="Erro ao carregar dados.";tr.appendChild(td);t.appendChild(tr);})
    .finally(function(){document.getElementById("refresh-btn").classList.remove("spinning");});
}

document.getElementById("refresh-btn").addEventListener("click",load);
buildHead();load();
})();
</script>
</body>
</html>
